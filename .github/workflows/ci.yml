name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv .venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        run: . .venv/bin/activate && uv pip install -e ".[dev]"

      - name: Lint with ruff
        run: . .venv/bin/activate && ruff check engine/

      - name: Run tests
        run: . .venv/bin/activate && pytest engine/tests/ -v

  release-surface:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Build Python package
        run: uv build

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viz/spatial/package-lock.json

      - name: Install spatial viewer dependencies
        working-directory: viz/spatial
        run: npm ci

      - name: Audit spatial viewer dependencies
        working-directory: viz/spatial
        run: npm audit --audit-level=moderate

      - name: Build spatial viewer
        working-directory: viz/spatial
        run: npm run build
